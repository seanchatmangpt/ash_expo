name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Generate empty-manifest TypeScript falsifier
        run: mix ash_expo.codegen --output tmp/generated
      - name: Verify deterministic regeneration
        run: mix ash_expo.codegen --check --output tmp/generated
      - name: Type-check generated Expo runtime
        run: >-
          npx --yes -p typescript@5.9.3 tsc
          --noEmit
          --strict
          --target ES2022
          --module ESNext
          --moduleResolution bundler
          --lib ES2022,DOM
          tmp/generated/*.ts
      - name: Build Hex package without publishing
        run: mix hex.build
